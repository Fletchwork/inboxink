name: Release

# Runs when a version tag (v*) is pushed. Builds the sdist and wheel, publishes
# them to PyPI through Trusted Publishing (no stored token), then attaches the
# same files to a GitHub Release.
#
# One-time setup outside this repo:
#   - PyPI: add a trusted publisher for project `inboxink` pointing at
#     github.com/Fletchwork/inboxink, workflow `release.yml`, environment `pypi`.
#   - GitHub: create the `pypi` environment (Settings > Environments) and add a
#     required reviewer, so every publish waits for a manual approval.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # fetches every branch, so origin/main exists for the on-main check
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Check the tag matches the package version and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag $TAG does not match pyproject version v${version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi
          echo "OK: $TAG matches pyproject version and is on main"

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet "build==1.6.1"
          python -m build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/inboxink/
    permissions:
      contents: read
      id-token: write  # PyPI Trusted Publishing (OIDC); only this job gets it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # create the release; only this job gets it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
